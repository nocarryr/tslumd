name: Codspeed Benchmarks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: 3.13
    - name: Install Project
      run: uv sync --frozen --group test --group doc
    - name: Run benchmarks
      uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5
      with:
        mode: simulation
        run: uv run pytest tests/ --codspeed
