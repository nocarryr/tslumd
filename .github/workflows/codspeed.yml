name: Codspeed Benchmarks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Install uv
      uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: 3.13
    - name: Install Project
      run: uv sync --frozen --group test --group doc
    - name: Run benchmarks
      uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5
      with:
        mode: simulation
        run: uv run pytest tests/ --codspeed
